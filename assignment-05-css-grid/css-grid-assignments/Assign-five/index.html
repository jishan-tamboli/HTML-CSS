<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5 - Card Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Places to Explore</h1>

    <div class="card-container">
        <article class="card">
            <img src="https://picsum.photos/id/100/500/300" alt="Mountain view">
            <div class="card-content">
                <h2>Mountains</h2>
                <p>Enjoy the fresh air and beautiful mountain views.</p>
            </div>
        </article>

        <article class="card">
            <img src="https://picsum.photos/id/200/500/300" alt="Forest view">
            <div class="card-content">
                <h2>Forests</h2>
                <p>Explore peaceful trails surrounded by nature.</p>
            </div>
        </article>

        <article class="card">
            <img src="https://picsum.photos/id/300/500/300" alt="Ocean view">
            <div class="card-content">
                <h2>Oceans</h2>
                <p>Relax beside the sea and listen to the waves.</p>
            </div>
        </article>

        <article class="card">
            <img src="https://picsum.photos/id/400/500/300" alt="Lake view">
            <div class="card-content">
                <h2>Lakes</h2>
                <p>Discover calm lakes and scenic surroundings.</p>
            </div>
        </article>

        <article class="card">
            <img src="https://picsum.photos/id/500/500/300" alt="Desert view">
            <div class="card-content">
                <h2>Deserts</h2>
                <p>Experience wide open spaces and golden sands.</p>
            </div>
        </article>
    </div>
</body>
</html>
